<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="600" viewBox="0 0 1200 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="0.28" cy="0.5" r="0.55">
      <stop offset="0%" stop-color="#C6FF3F" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#C6FF3F" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#C6FF3F" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C6FF3F"/>
      <stop offset="100%" stop-color="#EFFF9E"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3E4A2E"/>
      <stop offset="70%" stop-color="#8FBF3A"/>
      <stop offset="100%" stop-color="#C6FF3F"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="600" fill="#0A0B09"/>
  <rect width="1200" height="600" fill="url(#glow)"/>
  <!-- subtle grid -->
  <g stroke="#161813" stroke-width="1">
    <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200"/>
    <path d="M300 0 V600 M600 0 V600 M900 0 V600"/>
  </g>
  <!-- footer hairline -->
  <rect x="0" y="596" width="1200" height="4" fill="#C6FF3F" opacity="0.9"/>

  <!-- ══ effort dial (left) ══ -->
  <g transform="translate(275,345)">
    <!-- track -->
    <path d="M -175 0 A 175 175 0 0 1 175 0" fill="none" stroke="#22271C" stroke-width="14" stroke-linecap="round"/>
    <!-- effort arc up to 'high' (~72% of the sweep) -->
    <path d="M -175 0 A 175 175 0 0 1 0 -175" fill="none" stroke="url(#arc)" stroke-width="14" stroke-linecap="round"/>
    <!-- ticks: low, medium, high, xhigh, max at 180,135,90,45,0 degrees, r=200 -->
    <g stroke="#3A4130" stroke-width="4" stroke-linecap="round">
      <line x1="-200" y1="0" x2="-184" y2="0"/>
      <line x1="-141.4" y1="-141.4" x2="-130.1" y2="-130.1"/>
      <line x1="0" y1="-200" x2="0" y2="-184"/>
      <line x1="141.4" y1="-141.4" x2="130.1" y2="-130.1"/>
      <line x1="200" y1="0" x2="184" y2="0"/>
    </g>
    <!-- labels -->
    <g font-family="Helvetica Neue, Helvetica, Arial" font-size="17" fill="#7E8A73" text-anchor="middle">
      <text x="-224" y="34">low</text>
      <text x="-152" y="-148">medium</text>
      <text x="0" y="-222">high</text>
      <text x="152" y="-148">xhigh</text>
      <text x="224" y="34">max</text>
    </g>
    <!-- needle pointing at 'high' (straight up) -->
    <g transform="rotate(0)">
      <line x1="0" y1="0" x2="0" y2="-158" stroke="#C6FF3F" stroke-width="9" stroke-linecap="round"/>
    </g>
    <circle cx="0" cy="0" r="15" fill="#C6FF3F"/>
    <circle cx="0" cy="0" r="6" fill="#0A0B09"/>
    <!-- verdict sample under the dial -->
    <g font-family="Menlo, Monaco, monospace" font-size="19" fill="#9AA893" text-anchor="middle">
      <text x="0" y="62">high · 82% sure · 356 ms</text>
      <text x="0" y="90" fill="#6E7A5E">judged once per turn</text>
    </g>
  </g>

  <!-- ══ wordmark block (right) ══ -->
  <g transform="translate(565,215)">
    <text font-family="Helvetica Neue, Helvetica, Arial" font-weight="700" font-size="66" fill="#F4F7EF" letter-spacing="-1">effortless<tspan fill="#C6FF3F">-hermes</tspan></text>
    <text x="2" y="52" font-family="Helvetica Neue, Helvetica, Arial" font-size="28" fill="#9AA893">Per-prompt reasoning effort for Hermes Agent</text>

    <!-- judge chips -->
    <g font-family="Menlo, Monaco, monospace" font-size="20">
      <g>
        <rect x="0" y="92" width="178" height="44" rx="22" fill="none" stroke="#C6FF3F" stroke-width="2"/>
        <text x="89" y="121" fill="#D9F08E" text-anchor="middle">Jev · TypeSafe</text>
      </g>
      <g>
        <rect x="198" y="92" width="168" height="44" rx="22" fill="none" stroke="#4A5340" stroke-width="2"/>
        <text x="282" y="121" fill="#B7C3AC" text-anchor="middle">local model</text>
      </g>
      <g>
        <rect x="386" y="92" width="150" height="44" rx="22" fill="none" stroke="#4A5340" stroke-width="2"/>
        <text x="461" y="121" fill="#B7C3AC" text-anchor="middle">custom API</text>
      </g>
    </g>

    <!-- one-line pitch -->
    <text x="2" y="196" font-family="Helvetica Neue, Helvetica, Arial" font-size="24" fill="#7E8A73">easy questions run cheap · hard jobs get high</text>
  </g>

  <!-- corner tag -->
  <g font-family="Menlo, Monaco, monospace" font-size="17" fill="#5C6650">
    <text x="40" y="56">MIT</text>
    <text x="40" y="56" dx="46">catalog-listed</text>
  </g>
</svg>
